
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Naija Life 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fc5dc;font-family:Arial,sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
.panel{background:#101b28cc;border:1px solid #ffffff30;border-radius:12px;padding:10px 13px;text-shadow:0 1px 3px #000}
#brand{position:absolute;top:14px;left:14px;font-weight:900;font-size:18px;letter-spacing:1px}
#brand small{display:block;font-size:10px;color:#ffcf54;margin-top:4px;letter-spacing:2px}
#mission{position:absolute;top:14px;right:14px;font-size:12px;max-width:190px}
#help{position:absolute;bottom:14px;left:14px;font-size:11px;line-height:1.7}
#message{position:absolute;top:86px;left:50%;transform:translateX(-50%);font-weight:bold;font-size:13px;text-align:center;white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101b28;color:white;z-index:10;text-align:center;padding:25px}
#loading h1{color:#ffca45}
#mobile{display:none;position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;bottom:28px;left:22px;width:124px;height:124px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff70;pointer-events:auto;touch-action:none}
#nub{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#ffffffa0;border:2px solid white}
.action{position:absolute;right:24px;width:64px;height:64px;border-radius:50%;background:#172638bb;border:2px solid #ffffffb0;color:white;font-weight:bold;pointer-events:auto;touch-action:none}
#jump{bottom:38px}
#sprint{bottom:112px}
#look{position:absolute;right:0;top:25%;width:48%;height:45%;pointer-events:auto;touch-action:none}
@media(max-width:700px){
 #mobile{display:block}
 #help{display:none}
 #mission{font-size:10px;max-width:145px}
 #brand{font-size:15px}
}
</style>
</head>
<body>
<div id="loading"><div><h1>NAIJA LIFE</h1><p>Loading your city...</p><small>3D CITY SIMULATOR</small></div></div>
<div id="hud">
 <div id="brand" class="panel">🇳🇬 NAIJA LIFE<small>LAGOS DISTRICT • PROTOTYPE</small></div>
 <div id="mission" class="panel">📍 EXPLORE LAGOS<br>Walk around the city<br><span id="position">District centre</span></div>
 <div id="message" class="panel">WASD to move · Drag to rotate camera</div>
 <div id="help" class="panel">WASD / ARROWS — MOVE<br>SHIFT — RUN<br>DRAG MOUSE — LOOK AROUND<br>SPACE — JUMP<br>R — RESET POSITION</div>
</div>
<div id="mobile">
 <div id="look"></div>
 <div id="stick"><div id="nub"></div></div>
 <button id="sprint" class="action">RUN</button>
 <button id="jump" class="action">JUMP</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const loading=document.getElementById('loading');
const msg=document.getElementById('message');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc5dc);
scene.fog=new THREE.Fog(0x9fc5dc,90,240);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,350);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9edff,0x78634b,2.1));
const sun=new THREE.DirectionalLight(0xffedcc,2.6);
sun.position.set(-35,65,25);
scene.add(sun);

const mat=(color,roughness=0.88)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x7d9970), asphalt=mat(0x34383c), pavement=mat(0xaaa69c);
const concrete=[0xc6b7a2,0xe0d1b7,0xb4c0c3,0xc3c4ba,0xd8b99b].map(c=>mat(c));
const glass=mat(0x426b7a,0.35), dark=mat(0x242a2e), white=mat(0xe8e7dc);
const yellow=mat(0xf3bd21), skin=mat(0x8d522e), shirt=mat(0x197c62), trousers=mat(0x252b37);
const rubber=mat(0x181a1b), metal=mat(0x9fa8ad,0.38);

function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);parent.add(m);return m;
}
function cylinder(parent,r1,r2,h,material,x,y,z,segments=8){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 m.position.set(x,y,z);parent.add(m);return m;
}
function sphere(parent,r,material,x,y,z){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),material);
 m.position.set(x,y,z);parent.add(m);return m;
}

// Ground and a connected grid of roads.
box(scene,500,0.2,500,grass,0,-0.18,0);
for(let i=-3;i<=3;i++){
 const p=i*28;
 box(scene,10,0.06,260,asphalt,p,0,-0);
 box(scene,260,0.06,10,asphalt,0,0,p);
 box(scene,2.2,0.08,260,pavement,p-6.2,0.02,0);
 box(scene,2.2,0.08,260,pavement,p+6.2,0.02,0);
 box(scene,260,0.08,2.2,pavement,0,0.02,p-6.2);
 box(scene,260,0.08,2.2,pavement,0,0.02,p+6.2);
 for(let j=-4;j<=4;j++){
  box(scene,0.13,0.025,2.6,white,p,0.045,j*28);
  box(scene,2.6,0.025,0.13,white,j*28,0.045,p);
 }
}
// Small procedural city blocks. No external models required.
let seed=7182;
function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
for(let gx=-4;gx<=4;gx++)for(let gz=-4;gz<=4;gz++){
 if(Math.abs(gx)<=1&&Math.abs(gz)<=1)continue;
 const cx=gx*28,cz=gz*28;
 for(let n=0;n<3;n++){
  const x=cx+(rand()-.5)*13,z=cz+(rand()-.5)*13;
  const w=5+rand()*5,d=5+rand()*5,h=5+rand()*17+(Math.abs(gx)>2?rand()*10:0);
  const b=new THREE.Group();b.position.set(x,0,z);scene.add(b);
  box(b,w,h,d,concrete[Math.floor(rand()*concrete.length)],0,h/2,0);
  // Roof lip and front-facing rows of windows.
  box(b,w+.2,.3,d+.2,white,0,h-.12,0);
  for(let wy=1.5;wy<h-1;wy+=2.1){
   for(let wx=-w/2+1;wx<w/2-.4;wx+=1.5){
    box(b,.85,1.05,.07,glass,wx,wy,d/2+.04);
    box(b,.9,.07,.1,white,wx,wy,d/2+.09);
   }
  }
  // Shopfronts on some low buildings.
  if(h<10){
   box(b,w*.78,1.7,.12,yellow,0,1.1,d/2+.1);
   box(b,w*.45,.28,.18,shirt,0,2.15,d/2+.15);
  }
 }
}
// Street lamps.
const lampMat=mat(0x343a3d);
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){
 if(Math.abs(i)>3||Math.abs(j)>3)continue;
 const x=i*28+7,z=j*28+7;
 cylinder(scene,.09,.13,4.2,lampMat,x,2.1,z);
 box(scene,1.1,.12,.12,lampMat,x+.45,4.15,z);
 sphere(scene,.2,mat(0xffe3a1),x+.9,4.1,z);
}
// Trees on pavements.
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){
 if(Math.abs(i)<=1&&Math.abs(j)<=1)continue;
 const x=i*28+8.4,z=j*28+8.4;
 cylinder(scene,.22,.34,2.5,mat(0x69452d),x,1.25,z);
 const crown=sphere(scene,1.45,mat(0x39754a),x,3.1,z);
 crown.scale.set(1,1.25,1);
}

// A simple, original yellow Nigerian danfo bus.
function makeBus(x,z,rotation=0){
 const g=new THREE.Group();scene.add(g);g.position.set(x,.08,z);g.rotation.y=rotation;
 box(g,2.5,1.35,4.6,yellow,0,1.25,0);
 box(g,2.28,.68,2.4,mat(0xd6e2e5,.35),0,2.12,-.48);
 box(g,2.3,.58,1.2,yellow,0,2.05,1.48);
 box(g,2.34,.13,1.2,white,0,1.66,1.48);
 box(g,2.1,.12,2.4,shirt,0,1.57,-.5);
 for(const wx of [-1.3,1.3])for(const wz of [-1.45,1.45]){
  const wheel=cylinder(g,.42,.42,.2,rubber,wx,.47,wz,12);
  wheel.rotation.z=Math.PI/2;
  cylinder(g,.22,.22,.215,metal,wx*1.002,.47,wz,12).rotation.z=Math.PI/2;
 }
 for(const xx of [-.8,.8])box(g,.35,.23,.08,white,xx,1.05,2.32);
 box(g,.7,.2,.08,mat(0xff3228),0,1.05,-2.32);
 return g;
}
const buses=[makeBus(-13,7,Math.PI/2),makeBus(44,-19,0),makeBus(-43,39,Math.PI/2)];

// Player character, with animated arms and legs.
const player=new THREE.Group();scene.add(player);
const body=new THREE.Group();player.add(body);
box(body,.85,1.05,.48,shirt,0,1.65,0);
sphere(body,.31,skin,0,2.42,0);
sphere(body,.32,mat(0x171b1d),0,2.63,-.025).scale.set(1,.48,1);
box(body,.16,.07,.04,dark,-.13,2.44,.28);
box(body,.16,.07,.04,dark,.13,2.44,.28);
box(body,.12,.05,.04,white,-.13,2.44,.31);
box(body,.12,.05,.04,white,.13,2.44,.31);
const arms=[],legs=[];
for(const side of [-1,1]){
 const arm=new THREE.Group();arm.position.set(side*.52,1.96,0);body.add(arm);
 box(arm,.23,.78,.24,shirt,0,-.32,0);
 sphere(arm,.14,skin,0,-.75,0);arms.push(arm);
 const leg=new THREE.Group();leg.position.set(side*.23,1.15,0);body.add(leg);
 box(leg,.29,.78,.32,trousers,0,-.33,0);
 box(leg,.32,.17,.48,dark,0,-.76,.08);legs.push(leg);
}
player.position.set(0,0,3);
let yaw=0,camYaw=0,camPitch=.25,vertical=0,grounded=true;
let moving=false,running=false,walkTime=0;
const keys={};
addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 if(e.code==='Space'&&grounded){vertical=7;grounded=false}
 if(e.code==='KeyR'){player.position.set(0,0,3);vertical=0}
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

// Mouse drag rotates the camera; mobile uses a separate look zone.
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'){dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 camYaw-=(e.clientX-lastX)*.006;
 camPitch=Math.max(-.05,Math.min(.7,camPitch+(e.clientY-lastY)*.004));
 lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
const look=document.getElementById('look');
let lookId=null;
look.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(e.pointerId)});
look.addEventListener('pointermove',e=>{
 if(lookId!==e.pointerId)return;
 camYaw-=(e.clientX-lastX)*.009;
 camPitch=Math.max(-.05,Math.min(.7,camPitch+(e.clientY-lastY)*.006));
 lastX=e.clientX;lastY=e.clientY;
});
look.addEventListener('pointerup',()=>lookId=null);
look.addEventListener('pointercancel',()=>lookId=null);

// Virtual joystick.
let joyX=0,joyY=0,joyId=null;
const stick=document.getElementById('stick'),nub=document.getElementById('nub');
function joystick(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const len=Math.hypot(dx,dy),max=39;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joyX=dx/max;joyY=dy/max;
 nub.style.transform=`translate(${dx}px,${dy}px)`;
}
stick.addEventListener('pointerdown',e=>{joyId=e.pointerId;stick.setPointerCapture(e.pointerId);joystick(e)});
stick.addEventListener('pointermove',e=>{if(joyId===e.pointerId)joystick(e)});
function releaseJoy(){joyId=null;joyX=0;joyY=0;nub.style.transform='translate(0,0)'}
stick.addEventListener('pointerup',releaseJoy);
stick.addEventListener('pointercancel',releaseJoy);
const sprintBtn=document.getElementById('sprint');
sprintBtn.addEventListener('pointerdown',e=>{e.preventDefault();running=true});
for(const ev of ['pointerup','pointercancel','pointerleave'])sprintBtn.addEventListener(ev,()=>running=false);
document.getElementById('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();if(grounded){vertical=7;grounded=false}
});

const clock=new THREE.Clock();
const cameraTarget=new THREE.Vector3();
let elapsed=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
 const forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joyY;
 const side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joyX;
 const len=Math.hypot(forward,side);
 moving=len>.12;
 const sprint=running||keys.ShiftLeft||keys.ShiftRight;
 const speed=sprint?8:4.5;
 if(moving){
  const f=Math.min(1,len);
  const dx=(Math.sin(camYaw)*forward+Math.cos(camYaw)*side);
  const dz=(Math.cos(camYaw)*forward-Math.sin(camYaw)*side);
  const mag=Math.hypot(dx,dz)||1;
  player.position.x+=dx/mag*speed*f*dt;
  player.position.z+=dz/mag*speed*f*dt;
  yaw=Math.atan2(dx/mag,dz/mag);
  player.rotation.y=yaw;
  walkTime+=dt*(sprint?12:8);
 }
 vertical-=18*dt;player.position.y+=vertical*dt;
 if(player.position.y<0){player.position.y=0;vertical=0;grounded=true}
 const swing=moving?Math.sin(walkTime)*.62:0;
 arms[0].rotation.x=swing;arms[1].rotation.x=-swing;
 legs[0].rotation.x=-swing;legs[1].rotation.x=swing;
 body.position.y=moving&&grounded?Math.abs(Math.sin(walkTime*2))*.045:0;
 // Keep the camera behind the player, with user-controlled orbit.
 const distance=8.5;
 const horiz=Math.cos(camPitch)*distance;
 camera.position.set(
  player.position.x-Math.sin(camYaw)*horiz,
  player.position.y+2.7+Math.sin(camPitch)*distance,
  player.position.z-Math.cos(camYaw)*horiz
 );
 cameraTarget.set(player.position.x,player.position.y+1.65,player.position.z);
 camera.lookAt(cameraTarget);
 document.getElementById('position').textContent=
  `X ${Math.round(player.position.x)} · Z ${Math.round(player.position.z)}`;
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
loading.style.display='none';
animate();
</script>
</body>
</html>
